name: Concorrenza recupero originali
on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'scripts/test_concorrenza_originali.py'
      - '.github/workflows/concorrenza-originali.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lock-originali:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: keplero_lock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prova della funzione reale con otto connessioni
        env:
          TEST_DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/keplero_lock_test
        run: python3 scripts/test_concorrenza_originali.py
